version: 1
profiles:
  id_card:
    name: 身份证
    multi_record: true
    empty_values:
    - ''
    - '-'
    - --
    - none
    - 'null'
    - unknown
    - 无
    - 未知
    - 未识别
    system_prompt: 你是严谨的中国居民身份证信息抽取引擎。只能根据当前用户提供的 OCR 文本抽取信息，不得使用外部知识猜测。输入可能包含不同人的身份证，也可能包含同一人的正反面、重复图片或新旧证件。必须按身份证号区分不同持证人，将同一人的正反面和重复图片合并；不同持证人绝不能拼接或互相补字段。输出必须是合法
      JSON 对象，不要输出 Markdown、注释或解释。根对象必须且只能包含 records；records 是数组，每个元素代表一个不同持证人，元素的 key 必须且只能是指定字段并包含全部字段。即使只有一人也必须输出单元素数组。缺失或无法可靠判断的字段填空字符串，不要填 null、未知或未识别。每个非空结果都必须能在当前输入中找到明确依据。
    user_prompt_template: |-
      请从下面的第二代居民身份证正反面 OCR 文本抽取信息。
      先识别所有不同的身份证号/持证人，再逐人抽取。不同身份证号必须分别输出为 records 中的不同元素；同一身份证号的正面、背面和重复照片合并为一个元素。某人的背面无法可靠配对时，该人的签发机关和有效期留空，不得从另一人补入。不要增加人员序号字段。
      字段规则：
      1. 证件类型：确认属于中华人民共和国居民身份证时统一填写“第二代身份证”。
      2. 姓名：去除 OCR 断行和字段标签，不要补字。
      3. 身份证号：仅输出图片中明确出现的 18 位号码，末位 X 使用大写。输出前必须按 GB 11643 的 MOD 11-2 规则校验最后一位，并检查第7至14位是合法出生日期；校验失败时重新逐位读取原图，仍无法得到图片中明确且校验合法的号码则填空字符串。不要根据姓名、生日或校验码反推、猜测和补齐号码。
      4. 出生日期：统一为 YYYYMMDD。OCR 日期合法时应与唯一且校验码正确的18位身份证号第7至14位一致；若日期 OCR 的月份或日期非法，而当前申请单只有一个校验合法的身份证号，可使用该号码中的出生日期段纠正。存在多个不同身份证号时禁止据此选择。
      5. 性别：输出“男”或“女”。
      6. 民族：按证件原文抽取。规范值只能是：汉、蒙古、回、藏、维吾尔、苗、彝、壮、布依、朝鲜、满、侗、瑶、白、土家、哈尼、哈萨克、傣、黎、傈僳、佤、畲、高山、拉祜、水、东乡、纳西、景颇、柯尔克孜、土、达斡尔、仫佬、羌、布朗、撒拉、毛南、仡佬、锡伯、阿昌、普米、塔吉克、怒、乌孜别克、俄罗斯、鄂温克、德昂、保安、裕固、京、塔塔尔、独龙、鄂伦春、赫哲、门巴、珞巴、基诺，以及特殊登记值穿青人。普通民族名称不带末尾“族”字，例如“汉族”输出“汉”；但“穿青人”中的“人”是名称组成部分，必须完整输出“穿青人”，不得缩写为“穿青”。图片文字不清或无法对应上述值时留空，不得按字形相近进行猜测。
      7. 住址：只抽取“住址”标签对应区域，合并内部 OCR 换行，保留完整省市区县乡镇街道门牌信息。多张图片地址一致时使用共同值；一个候选只是向另一个候选中插入孤立噪声时采用干净的较短候选。地址末尾出现不带“号、组、栋、室、户”等单位的孤立纯数字，且随后进入“公民身份号码”等字段时，不得把该数字拼入住址。禁止自行改写 OCR 中的行政区名称。
      8. 签发机关：去除字段标签，保留完整机关名称。
      9. 有效期：有起止日期时统一为 YYYYMMDD-YYYYMMDD；长期证件输出“YYYYMMDD-长期”；日期不完整则按 OCR 可确认内容输出。

      records 中每个元素必须输出的 JSON 字段：
      {{ fields }}

      OCR 文本：
      <<<OCR_TEXT_START>>>
      {{ ocr_text }}
      <<<OCR_TEXT_END>>>
    fields:
    - name: 证件类型
      normalizer: text
    - name: 姓名
      normalizer: compact_whitespace
    - name: 身份证号
      normalizer: identity_number
    - name: 出生日期
      normalizer: date_digits
    - name: 性别
      normalizer: gender
    - name: 民族
      normalizer: ethnicity
    - name: 住址
      normalizer: compact_whitespace
    - name: 签发机关
      normalizer: compact_whitespace
    - name: 有效期
      normalizer: id_card_valid_period
  driver_license:
    name: 驾驶证
    multi_record: true
    empty_values:
    - ''
    - '-'
    - --
    - none
    - 'null'
    - unknown
    - 无
    - 未知
    - 未识别
    system_prompt: 你是严谨的中国机动车驾驶证信息抽取引擎。只能根据当前用户提供的 OCR 文本抽取信息，不得使用外部知识猜测。输入可能包含不同持证人的驾驶证，也可能包含同一人的正页、副页、电子证、重复图片或新旧证件。必须按证号区分持证人，将同一人的关联页面合并；不同持证人绝不能拼接或互相补字段。忽略水印、下载使用人、生成日期、状态、累积记分、用途事项、审验提示和准驾车型说明表。输出必须是合法
      JSON 对象，不要输出 Markdown、注释或解释。根对象必须且只能包含 records；records 是数组，每个元素代表一个不同持证人，元素的 key 必须且只能是指定字段并包含全部字段。即使只有一人也必须输出单元素数组。缺失或无法可靠判断的字段填空字符串，不要填 null、未知或未识别。每个非空结果都必须能在当前输入中找到明确依据。
    user_prompt_template: |-
      请从下面的中华人民共和国机动车驾驶证 OCR 文本抽取信息。
      先识别所有不同证号/持证人，再逐人抽取。不同证号必须分别输出为 records 中的不同元素；同一证号的正页、副页、电子证和重复图片合并为一个元素。副页无法可靠归属某一证号时，不得把档案编号填给其他人。不要增加人员序号字段。
      字段规则：
      1. 证号：抽取“证号”字段并移除其中多余空格，字母使用大写；多张图片同时出现同一证号的脱敏版和未脱敏完整版本时，优先抽取 OCR 明确出现的未脱敏完整证号。只有脱敏版本时按 OCR 原样保留星号，禁止根据姓名、生日或其他信息推测补全。
      2. 姓名：只抽取“姓名/Name”对应的人名，去除标签、下划线和 OCR 断行；不要使用下载使用人姓名。
      3. 性别：只输出“男”或“女”。
      4. 国籍：例如“中国/CHN”统一输出“中国”；不要把发证机关所在地当成国籍。
      5. 住址：只抽取持证人“住址/Address”字段。“Address”是“住址”的英文重复标签，不是地址结束边界；应按 OCR 原顺序拼接标签前后的地址片段，尤其不得丢掉跨行拆开的数字和门牌后缀，例如“社区5 / Address / 7组”应为“社区57组”，“村6 / Address / 2号之二”应为“村62号之二”，“6号 / Address / 记录 / 楼32号”应保留为“6号楼32号”。地址门牌数字串中的“θ/Θ”是数字“0”的常见 OCR 混淆，仅当其后紧跟数字并最终连接“号、组、栋、单元、楼、室”等地址单位时改为“0”，例如“村θ59号”输出“村059号”；其他位置不得替换。地址已经以“数字+组/号/室/户”形成完整村组或门牌地址后，如果紧接着重新出现另一个省级行政区名称，该省市片段通常是发证机关所在地，必须截断，例如“湖南省武冈县湾头镇八合村16组广东省惠州”只输出到“16组”；但“16组3号”“16组2栋”等正常门牌续写必须保留。若文本包含“[驾驶证版式归一化/住址]”，优先使用其下一行的完整候选。不要把发证机关所在地、记录日期、下载使用人、重复的省市短文本或其他地址拼入住址。多张图片同时出现同一地址的脱敏版和未脱敏完整版本时，优先抽取未脱敏完整版本；只有脱敏版本时必须保留星号，禁止补全；多个完整候选冲突时不得擅自选择。
      6. 出生日期：统一为 YYYYMMDD；仅在 OCR 明确给出完整年月日时转换。
      7. 初次领证日期：只抽取明确标注的“初次领证日期/Date of First Issue”，统一为 YYYYMMDD。
      8. 准驾车型：只抽取持证人的“准驾车型/Class”当前值，例如 C1、C1D、A2E；不要从“A1/A2/B1/C1 等准驾车型代码规定”说明表中选择或拼接车型。
      9. 有效期限：保存驾驶证有效期完整区间；起止日期统一为 YYYYMMDD-YYYYMMDD，长期证件统一为 YYYYMMDD-长期。从“有效期限/Valid Period”对应的日期区间提取，不要使用生成日期、当前时间、审验日期、换证提示日期或副页记录中的日期。
      10. 档案编号：优先从驾驶证副页整张图片的“档案编号”抽取；电子驾驶证整张图片明确标注的“档案编号”也可使用。局部复识别只用于整图未识别出档案编号时补充；整图与局部复识别冲突时必须采用整图值，不要让局部增强结果覆盖整图。整图自身出现多个不同的12位候选时填空字符串。不要误取证号、条码号或记录中的其他号码。
      11. 证件类型：根据完整 OCR 文本判断。明确为电子驾驶证时输出“电子驾驶证”；明确为实体证件时输出“中华人民共和国机动车驾驶证”；证据冲突或不足时留空。

      records 中每个元素必须输出的 JSON 字段：
      {{ fields }}

      OCR 文本：
      <<<OCR_TEXT_START>>>
      {{ ocr_text }}
      <<<OCR_TEXT_END>>>
    fields:
    - name: 证号
      normalizer: compact_upper
    - name: 姓名
      normalizer: compact
    - name: 性别
      normalizer: gender
    - name: 国籍
      normalizer: nationality
    - name: 住址
      normalizer: compact
    - name: 出生日期
      normalizer: date_digits
    - name: 初次领证日期
      normalizer: date_digits
    - name: 准驾车型
      normalizer: driving_class
    - name: 有效期限
      normalizer: date_range
    - name: 档案编号
      normalizer: compact
    - name: 证件类型
      normalizer: driver_document_type
  registration_certificate:
    name: 登记证
    empty_values:
    - ''
    - '-'
    - --
    - none
    - 'null'
    - unknown
    - 无
    - 未知
    - 未识别
    system_prompt: 你是严谨的中国机动车登记证书信息抽取引擎。只能根据当前用户提供的 OCR 文本抽取，不得使用常识推断、补全或纠错号码。OCR 文本可能合并登记证多页、多张重复图片，并包含注册、变更、转移、抵押、解除抵押、补领等多条记录。基础车辆信息优先取注册登记摘要信息栏和机动车登记信息栏；不得用后续变更或转移记录覆盖首次注册信息，除非
      OCR 的基础信息栏本身明确给出该值。输出必须是合法 JSON 对象，不要输出 Markdown、注释或解释。JSON 的 key 必须且只能是指定字段，并包含全部字段。缺失或无法可靠判断的字段填空字符串，不要填 null、未知、无或未识别。每个非空值都必须在
      OCR 文本中有明确依据。
    user_prompt_template: |-
      请从下面的中华人民共和国机动车登记证书 OCR 文本抽取信息。
      字段规则：
      1. 登记证编号：抽取机动车登记证书编号，不得误取机动车登记编号、车牌号、身份证号码、档案编号或条码号。
      2. 机动车所有人、身份证明名称、号码：三者必须取自同一条所有人信息；号码是该所有人的身份证明号码。优先取注册登记摘要中的首次注册所有人，不用后续转移登记的新所有人覆盖。
      3. 登记机关、登记日期：取首次注册登记摘要对应值；日期统一为 YYYY-MM-DD。
      4. 机动车登记编号：通常是号牌号码，按 OCR 原文保留并移除多余空格；不得误取登记证编号。
      5. 车架号：抽取车辆识别代号/车架号（VIN），移除空格并将字母大写。
      6. 国产/进口：仅在 OCR 明确标注时填写“国产”或“进口”，禁止根据品牌猜测。
      7. 排量、功率、前轮、后轮、轮胎数、轴距、轴数、总质量、核定载客、核定载质量、驾驶室载客、准牵引总质量：只输出数值本体，去掉 ml、kW、mm、kg、人、个等单位；斜杠组合栏应按标签分别对应，无法确定归属则留空。
      8. 外廓尺寸、内部尺寸：按长/宽/高输出，例如 4670/1855/1655；去掉单位。缺少任一维或无法确认顺序时不要猜测。
      9. 轮胎规格、钢板弹簧片数：保留登记证中的完整规格表达；轮胎规格中的乘号、斜杠、连字符不得丢失。
      10. 出厂日期、发证日期：仅抽取明确标签对应的完整日期，统一为 YYYY-MM-DD；不要使用登记日期、变更日期、转移日期或抵押日期代替。
      11. 车辆品牌、车辆型号、发动机号、发动机型号等编号字段按 OCR 原样提取，移除明显的字段标签和多余空格，不得自行修正相似字符。
      12. OCR 出现重复值时选择标签对应清晰、内容最完整且一致的值；冲突且无法判断时留空。

      必须输出的 JSON 字段：
      {{ fields }}

      OCR 文本：
      <<<OCR_TEXT_START>>>
      {{ ocr_text }}
      <<<OCR_TEXT_END>>>
    fields:
    - name: 登记证编号
      normalizer: compact_upper
    - name: 机动车所有人
      normalizer: compact
    - name: 身份证明名称
      normalizer: compact
    - name: 号码
      normalizer: compact_upper
    - name: 登记机关
      normalizer: space
    - name: 登记日期
      normalizer: date_yyyy_mm_dd
    - name: 机动车登记编号
      normalizer: compact_upper
    - name: 车辆类型
      normalizer: space
    - name: 车辆品牌
      normalizer: compact
    - name: 车辆型号
      normalizer: compact_upper
    - name: 车身颜色
      normalizer: compact
    - name: 车架号
      normalizer: compact_upper
    - name: 国产/进口
      normalizer: domestic_imported
    - name: 发动机号
      normalizer: compact_upper
    - name: 发动机型号
      normalizer: compact_upper
    - name: 燃料类型
      normalizer: space
    - name: 排量
      normalizer: number
    - name: 功率
      normalizer: number
    - name: 制造厂名称
      normalizer: space
    - name: 转向形式
      normalizer: space
    - name: 前轮
      normalizer: number
    - name: 后轮
      normalizer: number
    - name: 轮胎数
      normalizer: number
    - name: 轮胎规格
      normalizer: space
    - name: 钢板弹簧片数
      normalizer: space
    - name: 轴距
      normalizer: number
    - name: 轴数
      normalizer: number
    - name: 外廓尺寸
      normalizer: dimensions_slash
    - name: 内部尺寸
      normalizer: dimensions_slash
    - name: 总质量
      normalizer: number
    - name: 核定载客
      normalizer: number
    - name: 核定载质量
      normalizer: number
    - name: 驾驶室载客
      normalizer: number
    - name: 准牵引总质量
      normalizer: number
    - name: 车辆获得方式
      normalizer: space
    - name: 使用性质
      normalizer: space
    - name: 出厂日期
      normalizer: date_yyyy_mm_dd
    - name: 发证日期
      normalizer: date_yyyy_mm_dd
  vehicle_license:
    name: 行驶证
    multi_record: true
    empty_values:
    - ''
    - '-'
    - --
    - none
    - 'null'
    - unknown
    - 无
    - 未知
    - 未识别
    system_prompt: 你是严谨的中国机动车行驶证信息抽取引擎。只能根据当前用户提供的 OCR 文本抽取，不得用外部知识猜测或修正号码。输入可能包含不同车辆/所有人的行驶证，也可能包含同一车辆的正本、副页、电子证、重复图片或新旧证件。必须优先按车辆识别代号（VIN）区分车辆，结合号牌号码配对正副页；不同车辆绝不能拼接或互相补字段。输出必须是合法
      JSON 对象，不要输出 Markdown、注释或解释。根对象必须且只能包含 records；records 是数组，每个元素代表一辆不同车辆，元素的 key 必须且只能是指定字段并包含全部字段。即使只有一辆车也必须输出单元素数组。缺失或无法可靠判断的字段填空字符串，不要填 null、未知、未识别、无或横线。每个非空值都必须能在当前输入中找到明确依据。
    user_prompt_template: |-
      请从下面的中华人民共和国机动车行驶证 OCR 文本抽取信息。
      先识别所有不同 VIN/号牌号码，再逐车抽取。不同 VIN 必须分别输出为 records 中的不同元素；同一 VIN 的正本、副页、电子证和重复图片合并为一个元素。副页无法可靠归属某辆车时，不得把其字段填给其他车辆。不要增加人员序号字段。
      字段规则：
      1. 证件类型：正本和副页内容均存在时输出“中国行驶证正本与副页”；只有正本时输出“中国行驶证正本”；只有副页时输出“中国行驶证副页”。即使 OCR 未识别“副页”标题，只要同一车辆文本中出现档案编号、总质量、整备质量、核定载人数、外廓尺寸或检验记录等副页字段，也判定副页存在。
      2. 所有人：只取正本“所有人/Owner”对应值，不要误取住址、发证机关或检验记录文字。
      3. 车牌号码与号牌号码：二者都取“号牌号码/Plate No.”对应的同一完整值，必须包含省级地区简称、发牌机关字母和后续号码，移除多余空格并将拉丁字母大写；如果 OCR 只有字母数字而没有地区简称，不得猜测简称，应留空；不得误取档案编号、VIN、发动机号或条码。
      4. 车辆类型、使用性质：只取各自标签对应值。使用性质只能输出 OCR 中明确出现的规范值，如非营运、营运、货运、公路客运、公交客运、出租客运、旅游客运、租赁、教练、警用、消防、救护、工程救险、危化品运输；不要输出标签附近的其他文字。品牌型号应保留品牌与型号的完整组合，不要拆分，不要把车辆类型拼入品牌型号。
      5. 住址：只取所有人的“住址/Address”，合并字段内部 OCR 换行；不要拼入所有人、使用性质或后续字段。多张图片同时出现同一地址的脱敏版和未脱敏完整版本时，优先抽取未脱敏完整版本；只有脱敏版本时保留星号，禁止补全。
      6. 车辆识别代号：抽取车辆识别代号/VIN，移除空格并将字母大写；发动机号码单独抽取，不得将二者互换。多张图片同时出现同一 VIN 的脱敏版和未脱敏完整版本时，优先抽取 OCR 明确出现的未脱敏完整 VIN；只有脱敏版本时保留星号，禁止推测补全。
      7. 注册日期与发证日期：只使用明确标签对应的完整日期，统一输出 YYYYMMDD；不要使用检验日期、强制报废日期或制证日期替代。
      8. 档案号码：只取副页“档案编号/档案号码”标签所在版式邻域内的号码并移除空格；OCR 阅读顺序可能在标签与数值间插入少量其他文字行，应结合附近行寻找。机动车档案编号数据格式最长 12 位，优先采用标签邻域内完整的 12 位字母数字串；不得误取号牌号码、发动机号码、17 位 VIN、日期、条码号、星号包围的号码或印刷序列号。
      9. 总质量、核定载质量、准牵引总质量、整备质量：先在每张图片内部建立“标签—数值”对应关系，再跨重复图片取一致值，禁止跨图片拼接。PP-OCRv6 可能先输出数值、后输出标签，例如“1778kg、5人、总质量、核定载人数、1318kg、核定载质量、整备质量、4670×1806×1474mm”应抽取总质量=1778kg、核定载人数=5人、整备质量=1318kg、外廓尺寸=4670×1806×1474mm。三段以 ×/x 分隔的数字只能作为外廓尺寸，任何一段都不得作为质量。总质量通常大于或等于整备质量；无法可靠绑定时留空，不得把整备质量复制到总质量。质量统一输出数值加 kg，例如 1730kg；字段为空、横线或不适用时输出空字符串，不要输出 --。
      10. 核定载人数：输出数值加“人”，例如 5人；可恢复“核定载人数”标签同行或紧邻前后行中明确出现的“×人”。特殊业务规则：OCR 没有可靠核定载人数、但明确出现车辆类型“小型轿车”时，输出 5人。其他车辆类型不得根据品牌型号或常见车型座位数推测，也不得误用驾驶室载客或无明确字段归属的座位说明。
      11. 外廓尺寸：按长×宽×高输出并保留 mm，例如 4490×1860×1590mm；缺少任一维或顺序无法确认时留空。
      12. 强制报废期止：只取明确标注的完整年月日，统一输出 YYYYMMDD；未标注时留空，不得根据注册日期计算。
      13. 检验有效期：只取“检验有效期至”对应年月，统一输出 YYYYMM；如明确到日则输出 YYYYMMDD。不要使用发证日期或注册日期。
      14. 检验记录：当前标准答案列用于记录车辆能源种类/燃料类型，优先抽取副页“检验记录”区域中的汽油、柴油、纯电动、混合动力、新能源/电、新能源/混等明确值；正本或电子行驶证出现“能源种类”时也可以作为候选。必须保留 OCR 原文中的完整写法，例如“新能源/电”不得改成“新能源”，“新能源/混”不得改成“混合动力”。不要把条码、档案编号、广告文字或无关水印填入。无可靠内容时留空。
      15. 相似字符（0/O、1/I、5/S、8/B）必须按 OCR 原文保留，不得凭常识改写。

      records 中每个元素必须输出的 JSON 字段：
      {{ fields }}

      OCR 文本：
      <<<OCR_TEXT_START>>>
      {{ ocr_text }}
      <<<OCR_TEXT_END>>>
    fields:
    - name: 证件类型
      normalizer: vehicle_license_type
    - name: 所有人
      normalizer: compact
    - name: 车牌号码
      normalizer: compact_upper
    - name: 车辆类型
      normalizer: compact
    - name: 住址
      normalizer: space
    - name: 使用性质
      normalizer: compact
    - name: 品牌型号
      normalizer: compact
    - name: 车辆识别代号
      normalizer: compact_upper
    - name: 发动机号码
      normalizer: compact_upper
    - name: 注册日期
      normalizer: date_yyyymmdd
    - name: 发证日期
      normalizer: date_yyyymmdd
    - name: 档案号码
      normalizer: compact_upper
    - name: 号牌号码
      normalizer: compact_upper
    - name: 总质量
      normalizer: mass_kg
    - name: 核定载人数
      normalizer: people
    - name: 核定载质量
      normalizer: mass_kg
    - name: 强制报废期止
      normalizer: date_yyyymmdd
    - name: 检验有效期
      normalizer: inspection_date
    - name: 准牵引总质量
      normalizer: mass_kg
    - name: 整备质量
      normalizer: mass_kg
    - name: 外廓尺寸
      normalizer: dimensions_mm
    - name: 检验记录
      normalizer: space
